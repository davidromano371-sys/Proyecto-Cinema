  <main class="inicio-sesion">
    <section class="caja-inicio-sesion">
      <h1>Iniciar sesión</h1>
      <form>
        <div class="campo">
          <label for="usuario">
            Usuario
          </label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            placeholder="Ingresá tu usuario"
            required
          />
        </div>
        <div class="campo">
          <label for="contrasena">
            Contraseña
          </label>
          <input
            type="password"
            id="contrasena"
            name="contrasena"
            placeholder="Ingresá tu contraseña"
            required
          />
        </div>
        <button
          type="submit"
          class="boton-iniciar"
        >
          Iniciar sesión
        </button>
      </form>
    </section>
  </main>
